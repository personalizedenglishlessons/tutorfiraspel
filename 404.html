<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>الصفحه مو موجوده · PEL</title>
<link rel="icon" type="image/svg+xml" href="/tutorfiraspel/brand/pel-favicon.svg?v=2">
<meta name="theme-color" content="#0E0E10">
<meta name="robots" content="noindex">
<style>
  :root{ --gold:#C8A96A; --gold-soft:#D8BD83; --bg:#0E0E10; --card:#16181D; --text:#EAE6DC; --muted:#8B8577; }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--text);
    font-family:'Tajawal','Cairo','Plus Jakarta Sans',system-ui,sans-serif;padding:24px;text-align:center;}
  .box{max-width:460px;width:100%;}
  .logo{font-family:'Fraunces',Georgia,serif;font-size:1.4rem;letter-spacing:.14em;color:var(--gold);margin-bottom:28px;display:block;text-decoration:none;}
  .code{font-family:'Fraunces',Georgia,serif;font-size:4.5rem;line-height:1;color:var(--gold);text-shadow:0 0 40px -8px rgba(200,169,106,.45);}
  h1{font-size:1.5rem;font-weight:700;margin:18px 0 8px;}
  p{color:var(--muted);font-size:1rem;line-height:1.7;margin-bottom:28px;}
  a.btn{display:inline-block;background:linear-gradient(135deg,var(--gold-soft),var(--gold));color:#141008;font-weight:700;
    padding:13px 34px;border-radius:999px;text-decoration:none;font-size:1rem;transition:transform .15s ease;}
  a.btn:hover{transform:translateY(-2px);}
  .en{font-size:.8rem;color:var(--muted);margin-top:18px;direction:ltr;}
</style>
</head>
<body>
  <div class="box">
    <a class="logo" href="/tutorfiraspel/">PEL</a>
    <div class="code">404</div>
    <h1>هالصفحه مو موجودة</h1>
    <p>يمكن الرابط قديم أو فيه غلط بسيط. لا تشيل هم — تقدمك محفوظ وكل شي بمكانه.</p>
    <a class="btn" href="/tutorfiraspel/">ارجع للبدايه</a>
    <div class="en">This page doesn't exist — your progress is safe.</div>
  </div>
</body>
</html>
