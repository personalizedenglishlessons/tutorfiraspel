<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>PEL Admin</title>
<link rel="icon" type="image/svg+xml" href="brand/pel-favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Tajawal:wght@300;400;500;700&family=Cairo:wght@400;500;700&display=swap" rel="preload" as="style" onload="this.onload=null;this.rel='stylesheet'"><noscript><link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Tajawal:wght@300;400;500;700&family=Cairo:wght@400;500;700&display=swap" rel="stylesheet"></noscript>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<script src="lib/pel-personalization.js"></script>
<script src="lib/pel-plans.js"></script>
<script src="lib/cert-qr.js"></script>
<script src="lib/cert-sheet.js"></script>
<link rel="stylesheet" href="admin/admin.css">
</head>
<body>

<div id="authGate">
  <div class="ring"><img class="pel-logo" src="brand/pel-wordmark.svg" alt="PEL"></div>
  <p>PEL Admin</p>
</div>

<div class="admin-shell" id="adminShell" style="display:none;">

  <aside id="sidebar">
    <div class="sidebar-head">
      <img class="pel-logo" src="brand/pel-wordmark.svg" alt="PEL">
      <img class="pel-logo pel-logo-light" src="brand/pel-wordmark-dark.svg" alt="PEL">
      <div class="sidebar-name">PEL Admin<small class="en-only">Operations Console</small><small class="ar-only">لوحة التشغيل</small></div>
    </div>
    <nav class="sidebar-scroll" id="sidebarNav"></nav>
    <div class="sidebar-foot">
      <div class="side-user">
        <span class="avatar-circle" id="adminAvatar"></span>
        <div class="side-user-name">
          <span id="adminName">-</span>
          <small id="adminRole">-</small>
        </div>
        <button class="side-logout" id="logoutBtn" title="Sign out">
          <i data-lucide="log-out" width="16" height="16"></i>
        </button>
      </div>
    </div>
  </aside>

  <div id="main">
    <header id="topbar">
      <button id="mobileMenuBtn" aria-label="Menu"><i data-lucide="menu" width="18" height="18"></i></button>
      <div>
        <div class="crumb" id="topCrumb">PEL Admin</div>
        <h1 id="topTitle">Overview</h1>
      </div>
      <div class="topbar-spacer"></div>
      <button class="lang-pill" id="langBtn">ع / EN</button>
    </header>
    <main id="viewArea"></main>
  </div>
</div>

<div id="toastStack"></div>

<script src="admin/admin.js"></script>
</body>
</html>
